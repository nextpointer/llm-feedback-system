services:
  - type: web
    name: llm-feedback-api
    runtime: node
    plan: free
    buildCommand: bun install && cd apps/server && bun install
    startCommand: cd apps/server && bun run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
